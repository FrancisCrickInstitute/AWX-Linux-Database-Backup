<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Backup Script Email</title>
</head>

<body style="margin:0;padding:0;font-family:Arial,sans-serif;font-size:16px;line-height:1.7;">

    <table
        style="border-spacing:0;max-width:600px;width:100%;margin:40px auto;background-color:#f7f7f7;border-radius:8px;overflow:hidden;"
        cellpadding="0" cellspacing="0">

        <!-- Header -->
        <tr>
            <td style="text-align:center;padding:20px;background-color:{{BACKGROUND_COLOR}};">
                <h1 style="margin:0;color:#ffffff;font-size:20px;">{{E_TYPE}}: {{SERVER}}</h1>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding:30px;color:#333333;">

                <h4 style="margin:0 0 15px 0;">{{SUBJECT}}</h4>

                <div style="padding:30px;margin:15px 0;background-color:#eeeeee;border-radius:12px;">
                    <pre style="margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:monospace;">{{BODY}}</pre>
                </div>

                <div style="padding:30px 0;color:{{BACKGROUND_COLOR}}; text-decoration:none;">
                    <p style="margin:0 0 10px 0;">
                        <a href="https://database-of-databases.thecrick.org/{{SERVER}}"
                            style="color:{{BACKGROUND_COLOR}};text-decoration:none;">
                            {{SERVER}} on DOD
                        </a>
                    </p>
                    <p style="margin:0;">
                        <a href="https://splunk-itsi.thecrick.org:8000/en-GB/app/CRICK_SEARCH_DATABASE/unix_vm_overview?form.host_input={{SERVER}}"
                            style="color:{{BACKGROUND_COLOR}};text-decoration:none;">
                            {{SERVER}} on Splunk
                        </a>
                    </p>
                </div>

            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="text-align:center;background-color:#eeeeee;padding:15px;font-size:12px;color:#777777;">
                Sent by backup script.
            </td>
        </tr>

    </table>

</body>

</html>
